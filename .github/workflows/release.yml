name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build options page
        run: npm run build:options

      - name: Install Playwright's Chromium
        run: npx playwright install --with-deps chromium

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run E2E tests
        run: xvfb-run -a npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    needs: test
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version (skip past any tag that already exists)
        id: bump
        run: |
          git fetch origin --tags --force

          npm --no-git-tag-version version patch
          version="$(node -p "require('./package.json').version")"

          while git rev-parse -q --verify "refs/tags/v$version" >/dev/null 2>&1; do
            echo "Tag v$version already exists — bumping patch again."
            npm --no-git-tag-version version patch
            version="$(node -p "require('./package.json').version")"
          done

          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          git add -A
          git commit -m "chore(release): v$version [skip ci]"
          git tag "v$version"

      - name: Push version bump and tag
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Build extension package
        run: npm run build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.version }}" \
            "dist/cookie-link-v${{ steps.bump.outputs.version }}.zip" \
            --title "v${{ steps.bump.outputs.version }}" \
            --generate-notes

      - name: Check Chrome Web Store credentials
        id: cws-secrets
        run: |
          if [ -n "${{ secrets.CHROME_EXTENSION_ID }}" ] && \
             [ -n "${{ secrets.CHROME_PUBLISHER_ID }}" ] && \
             [ -n "${{ secrets.CHROME_CLIENT_ID }}" ] && \
             [ -n "${{ secrets.CHROME_CLIENT_SECRET }}" ] && \
             [ -n "${{ secrets.CHROME_REFRESH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Chrome Web Store
        if: steps.cws-secrets.outputs.present == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npm run publish:chrome

      - name: Chrome Web Store publish skipped
        if: steps.cws-secrets.outputs.present != 'true'
        run: echo "CHROME_EXTENSION_ID/CHROME_PUBLISHER_ID/CHROME_CLIENT_ID/CHROME_CLIENT_SECRET/CHROME_REFRESH_TOKEN not all set as repo secrets — skipping Chrome Web Store publish. See DEPLOY.md to set it up."
