name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version
        run: |
          npm version patch -m "chore(release): v%s [skip ci]"

      - name: Push version bump and tag
        run: git push origin HEAD:${{ github.ref_name }} --follow-tags

      - name: Build extension package
        run: npm run build

      - name: Determine version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "dist/cookie-link-v${{ steps.version.outputs.version }}.zip" \
            --title "v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Check Chrome Web Store credentials
        id: cws-secrets
        run: |
          if [ -n "${{ secrets.CHROME_EXTENSION_ID }}" ] && \
             [ -n "${{ secrets.CHROME_PUBLISHER_ID }}" ] && \
             [ -n "${{ secrets.CHROME_CLIENT_ID }}" ] && \
             [ -n "${{ secrets.CHROME_CLIENT_SECRET }}" ] && \
             [ -n "${{ secrets.CHROME_REFRESH_TOKEN }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Chrome Web Store
        if: steps.cws-secrets.outputs.present == 'true'
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: npm run publish:chrome

      - name: Chrome Web Store publish skipped
        if: steps.cws-secrets.outputs.present != 'true'
        run: echo "CHROME_EXTENSION_ID/CHROME_PUBLISHER_ID/CHROME_CLIENT_ID/CHROME_CLIENT_SECRET/CHROME_REFRESH_TOKEN not all set as repo secrets — skipping Chrome Web Store publish. See DEPLOY.md to set it up."
